<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181715"/>
      <stop offset="100%" stop-color="#0E0E0C"/>
    </linearGradient>
  </defs>
  <!-- Squircle body -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg3)" stroke="#2E2C28" stroke-width="4"/>
  <!-- Abacus (Счёты) rods -->
  <line x1="88" y1="184" x2="424" y2="184" stroke="#3F3C36" stroke-width="14" stroke-linecap="round"/>
  <line x1="88" y1="328" x2="424" y2="328" stroke="#3F3C36" stroke-width="14" stroke-linecap="round"/>
  <!-- Top rod beads: one ivory left, one glowing amber right -->
  <rect x="124" y="136" width="96" height="96" rx="48" fill="#F4F2EE"/>
  <rect x="292" y="136" width="96" height="96" rx="48" fill="#F59E0B"/>
  <!-- Bottom rod beads: one amber left, one lime right -->
  <rect x="124" y="280" width="96" height="96" rx="48" fill="#F59E0B"/>
  <rect x="292" y="280" width="96" height="96" rx="48" fill="#A3E635"/>
</svg>