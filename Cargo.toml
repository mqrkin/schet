[package]
name = "schet"
version = "1.0.0"
edition = "2021"
description = "Lightning-fast native GTK3 notepad calculator written in Rust (12 MB RAM, 458 KB binary)"
license = "MIT"
repository = "https://github.com/mqrkin/schet"
keywords = ["calculator", "notepad", "gtk3", "math", "desktop"]
categories = ["gui", "mathematics", "command-line-utilities"]

[dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
pango = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
